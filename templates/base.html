<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CompraFácil{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f6f9;color:#263238}
    .navbar{background:#173b57}
    .navbar-brand{font-weight:700;letter-spacing:.3px}
    .card{border:0;border-radius:16px;box-shadow:0 4px 18px #1b344010}
    .btn{border-radius:9px}
    .form-control,.form-select{border-radius:9px}
    .required-note{font-size:.88rem;color:#667085}
    .invalid-feedback{display:block}
    .table thead th{background:#eaf0f5}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'inicio' %}">CompraFácil</a>
    {% if user.is_authenticated %}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'proveedores_lista' %}">Proveedores</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'compras_lista' %}">Compras</a></li>
      </ul>
      <span class="navbar-text me-3">Hola, {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% if messages %}{% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
